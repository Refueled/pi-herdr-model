# OPTIONAL example: keep your existing Radar layout if you already have one.
# The model-title.cjs render hook supplies the model; title tokens retain Radar's
# animated spinner, done tick, and blocked pulse. Do not replace them with state tokens.
# Merge this entry into your EXISTING table; never declare that table twice.
# Keep custom tables outside Radar's managed markers to prevent overwrites.
[ui.sidebar.agents.rows_by_agent]
pi = [
  ["$group_parent"],
  ["$group", "$group_stale"],
  [
    "$split_mark",
    { token = "$logo", rules = [
      { contains = "\uE1A0", fg = "#d97757" },
      { contains = "\uE1AD", fg = "#4d6bfe" },
      { contains = "\uE1AE", fg = "#4285f4" },
      { contains = "\uE1A6", fg = "#1783ff" },
      { contains = "\uE1B0", fg = "#615ced" }
    ] },
    { token = "$logo_working", rules = [
      { contains = "\uE1A0", fg = "#d97757" },
      { contains = "\uE1AD", fg = "#4d6bfe" },
      { contains = "\uE1AE", fg = "#4285f4" },
      { contains = "\uE1A6", fg = "#1783ff" },
      { contains = "\uE1B0", fg = "#615ced" }
    ] },
    { token = "$logo_stale", dim = true },
    "$title_working", "$title_done", "$title_blocked", "$title_idle_fresh",
    "$title_idle", "$title_idle_stale", "$title_unknown"
  ],
  ["$gap"]
]
